name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate manifests, scripts, and release packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/browser-workbench/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/browser-workbench/.mcp.json >/dev/null
          bash -n plugins/browser-workbench/scripts/*.sh
          node --check plugins/browser-workbench/scripts/validate-png.mjs
          node --check plugins/browser-workbench/scripts/test-fixtures/fake-powershell.js
          node --check plugins/browser-workbench/scripts/test-fixtures/generate-png.mjs
          python3 -m py_compile plugins/browser-workbench/scripts/mcp_smoke_test.py
          bash plugins/browser-workbench/scripts/windows-image-bridge-test.sh
          package_one="$RUNNER_TEMP/browser-workbench-marketplace-one.zip"
          package_two="$RUNNER_TEMP/browser-workbench-marketplace-two.zip"
          bash plugins/browser-workbench/scripts/package-marketplace.sh "$package_one"
          bash plugins/browser-workbench/scripts/package-marketplace.sh "$package_two"
          cmp "$package_one" "$package_two"
          python3 - "$package_one" <<'PY'
          import sys
          import zipfile

          archive_path = sys.argv[1]
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              forbidden = ("/.git/", "/.cache/", "/.runtime/", "/browsers/", "/profiles/", "/output/", "/__pycache__/")
              assert all(not any(token in name for token in forbidden) for name in names), names
              assert all(not name.endswith((".env", ".secret", ".secrets")) for name in names), names
              assert any(name.endswith("/plugins/browser-workbench/.codex-plugin/plugin.json") for name in names), names
          PY

      - name: Run browser and MCP smoke tests
        working-directory: plugins/browser-workbench
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          bash scripts/setup.sh
          bash scripts/doctor.sh
          bash scripts/smoke-test.sh
          bash scripts/mcp-smoke-test.sh
